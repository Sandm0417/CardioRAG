[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cardiorag"
version = "0.1.0"
description = "CardioRAG（心智脉）— 心血管临床对话的图检索增强生成系统"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "CardioRAG Team"}
]
dependencies = [
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "tqdm>=4.66.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
llm = [
    "openai>=1.0.0",
    "anthropic>=0.30.0",
    "google-generativeai>=0.8.0",
    "tiktoken>=0.5.0",
]
rag = [
    "lightrag-hku>=1.0.0",
]
pdf = [
    "pymupdf>=1.24.0",
]
ui = [
    "streamlit>=1.30.0",
]
figures = [
    "matplotlib>=3.8.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3.0",
    "mypy>=1.8",
]
all = [
    "cardiorag[llm,rag,pdf,ui,dev]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
